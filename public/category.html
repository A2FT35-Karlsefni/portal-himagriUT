<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategori - NusantaraPost</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Navbar -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xl">N</div>
        <div>
          <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">NusantaraPost</span>
          <span class="block text-[10px] font-medium text-slate-400 -mt-1 uppercase">Kategori Topik</span>
        </div>
      </a>
      <div class="flex items-center space-x-4">
        <button onclick="toggleTheme()" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
        <div id="navbar-auth-section"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    <!-- Category Hero Header -->
    <div class="bg-gradient-to-r from-indigo-900 to-slate-900 rounded-3xl p-8 sm:p-12 text-white mb-10 shadow-xl relative overflow-hidden">
      <div class="relative z-10 max-w-2xl">
        <a href="/" class="text-xs text-indigo-300 hover:underline mb-2 inline-block">&larr; Kembali ke Semua Artikel</a>
        <h1 id="cat-title" class="text-3xl sm:text-4xl font-extrabold mb-3">Memuat Kategori...</h1>
        <p id="cat-desc" class="text-sm text-slate-300 leading-relaxed"></p>
        <div class="mt-4 flex items-center space-x-3 text-xs text-indigo-200">
          <span id="cat-count">0 Artikel</span>
        </div>
      </div>
    </div>

    <!-- Category Articles Grid -->
    <div id="cat-articles-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Populated dynamically -->
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const pathParts = window.location.pathname.split('/');
      const slug = pathParts[pathParts.length - 1];
      if (!slug) { window.location.href = '/'; return; }

      try {
        const catRes = await fetch(`/api/categories/${slug}`);
        const catData = await catRes.json();
        if (catData.success) {
          const c = catData.data;
          document.title = `${c.name} - NusantaraPost`;
          document.getElementById('cat-title').textContent = c.name;
          document.getElementById('cat-desc').textContent = c.description || 'Kumpulan tulisan dan analisis mendalam seputar ' + c.name;
          document.getElementById('cat-count').textContent = `${c.article_count} Artikel Terpublikasi`;
        }

        const artRes = await fetch(`/api/articles?category=${slug}&status=published&limit=12`);
        const artData = await artRes.json();
        const grid = document.getElementById('cat-articles-grid');

        if (artData.success && artData.data.length > 0) {
          grid.innerHTML = artData.data.map(art => `
            <article class="bg-white dark:bg-slate-900 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 dark:border-slate-800 flex flex-col group">
              <div class="relative h-48 overflow-hidden bg-slate-100 dark:bg-slate-800">
                <img src="${art.cover_image}" alt="${art.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                <span class="absolute top-3 left-3 px-2.5 py-1 rounded-xl text-xs font-semibold backdrop-blur-md ${getCategoryColor(art.category_color)}">
                  ${art.category_name}
                </span>
              </div>
              <div class="p-5 flex-1 flex flex-col">
                <div class="text-[11px] text-slate-400 mb-2">${formatTimeAgo(art.created_at)} • ${art.reading_time} mnt baca</div>
                <h3 class="text-base font-bold text-slate-900 dark:text-white group-hover:text-indigo-600 transition line-clamp-2 leading-snug mb-2">
                  <a href="/artikel/${art.slug}">${art.title}</a>
                </h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-4 flex-1">${art.excerpt}</p>
                <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
                  <div class="flex items-center space-x-2">
                    <img src="${art.author_avatar}" class="w-6 h-6 rounded-full object-cover" />
                    <span class="font-medium text-slate-700 dark:text-slate-300">${art.author_name}</span>
                  </div>
                  <span class="text-slate-400 text-[11px]">👁 ${art.view_count}</span>
                </div>
              </div>
            </article>
          `).join('');
        } else {
          grid.innerHTML = '<div class="col-span-3 text-center py-16 text-slate-400">Belum ada artikel pada kategori ini.</div>';
        }
      } catch (err) {
        console.error('Failed to load category', err);
      }
    });
  </script>
</body>
</html>
