<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Baru - NusantaraPost</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors">

  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center space-x-2.5">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-black text-2xl shadow-xl shadow-indigo-600/30">N</div>
        <div class="text-left">
          <span class="text-2xl font-black bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">NusantaraPost</span>
          <span class="block text-[11px] font-medium text-slate-400 -mt-1 tracking-wider uppercase">Portal Artikel Multi-Level</span>
        </div>
      </a>
      <h2 class="text-xl font-bold mt-4 text-slate-900 dark:text-white">Buat Akun Pembaca Baru</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Dapatkan akses penuh untuk menyukai, berkomentar, dan menyimpan artikel.</p>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl">
      <form id="register-form" onsubmit="handleFormRegister(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Nama Lengkap</label>
            <input 
              type="text" 
              id="name-input" 
              placeholder="Contoh: Ahmad Fauzi" 
              required
              class="w-full text-sm bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white transition"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Username Unik</label>
            <input 
              type="text" 
              id="username-input" 
              placeholder="ahmadfauzi" 
              required
              class="w-full text-sm bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white transition"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Alamat Email</label>
            <input 
              type="email" 
              id="email-input" 
              placeholder="ahmad@example.com" 
              required
              class="w-full text-sm bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white transition"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Kata Sandi (Min. 6 Karakter)</label>
            <input 
              type="password" 
              id="password-input" 
              placeholder="••••••••" 
              required
              minlength="6"
              class="w-full text-sm bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white transition"
            />
          </div>

          <button 
            type="submit" 
            class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200"
          >
            Daftar Sekarang
          </button>
        </div>
      </form>
    </div>

    <p class="text-center text-xs text-slate-500 mt-6">
      Sudah punya akun? <a href="/login" class="text-indigo-600 font-bold hover:underline">Masuk di sini</a>
    </p>
  </div>

  <script src="/js/main.js"></script>
  <script>
    async function handleFormRegister(e) {
      e.preventDefault();
      const name = document.getElementById('name-input').value.trim();
      const username = document.getElementById('username-input').value.trim();
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, email, password })
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message, 'success');
          AppState.user = data.user;
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          showToast(data.message, 'error');
        }
      } catch (err) {
        showToast('Gagal mendaftar', 'error');
      }
    }
  </script>
</body>
</html>
