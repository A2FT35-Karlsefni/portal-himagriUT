<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Penulis - NusantaraPost</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xl">N</div>
        <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">NusantaraPost</span>
      </a>
      <div class="flex items-center space-x-4">
        <button onclick="toggleTheme()" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
        <div id="navbar-auth-section"></div>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    <!-- Author Header Card -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 mb-10 shadow-sm flex flex-col sm:flex-row items-center sm:items-start space-y-6 sm:space-y-0 sm:space-x-8">
      <img id="author-img" src="" alt="" class="w-28 h-28 rounded-3xl object-cover border-4 border-indigo-500 shadow-xl" />
      <div class="flex-1 text-center sm:text-left">
        <div class="flex flex-col sm:flex-row sm:items-center space-y-2 sm:space-y-0 sm:space-x-3 mb-2">
          <h1 id="author-name" class="text-2xl font-black text-slate-900 dark:text-white"></h1>
          <span id="author-badge" class="inline-block text-xs font-bold px-3 py-1 rounded-full uppercase bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300"></span>
        </div>
        <p id="author-bio" class="text-sm text-slate-600 dark:text-slate-300 mb-6 max-w-2xl leading-relaxed"></p>
        
        <!-- Stats -->
        <div class="flex items-center justify-center sm:justify-start space-x-6 text-xs font-semibold">
          <div class="bg-slate-50 dark:bg-slate-800 px-4 py-2 rounded-xl">
            <span id="stat-articles" class="text-base font-bold text-indigo-600 dark:text-indigo-400 block">0</span>
            <span class="text-slate-400">Artikel Terbit</span>
          </div>
          <div class="bg-slate-50 dark:bg-slate-800 px-4 py-2 rounded-xl">
            <span id="stat-views" class="text-base font-bold text-indigo-600 dark:text-indigo-400 block">0</span>
            <span class="text-slate-400">Total Pembaca</span>
          </div>
          <div class="bg-slate-50 dark:bg-slate-800 px-4 py-2 rounded-xl">
            <span id="stat-likes" class="text-base font-bold text-indigo-600 dark:text-indigo-400 block">0</span>
            <span class="text-slate-400">Total Suka</span>
          </div>
        </div>
      </div>
    </div>

    <h2 class="text-xl font-bold mb-6 text-slate-900 dark:text-white flex items-center">
      <span class="w-2.5 h-2.5 bg-indigo-600 rounded-full mr-2.5"></span>
      Artikel Karya Penulis Ini
    </h2>

    <div id="author-articles-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const pathParts = window.location.pathname.split('/');
      const id = pathParts[pathParts.length - 1];
      if (!id) { window.location.href = '/'; return; }

      try {
        const res = await fetch(`/api/users/author/${id}`);
        const data = await res.json();
        if (data.success) {
          const { author, stats, articles } = data.data;
          document.title = `${author.name} - Penulis NusantaraPost`;
          document.getElementById('author-img').src = author.avatar;
          document.getElementById('author-name').textContent = author.name;
          document.getElementById('author-badge').textContent = author.role;
          document.getElementById('author-bio').textContent = author.bio || 'Penulis aktif berbagi pengetahuan dan wawasan.';
          
          document.getElementById('stat-articles').textContent = stats.total_articles;
          document.getElementById('stat-views').textContent = stats.total_views;
          document.getElementById('stat-likes').textContent = stats.total_likes;

          const grid = document.getElementById('author-articles-grid');
          if (articles.length > 0) {
            grid.innerHTML = articles.map(art => `
              <article class="bg-white dark:bg-slate-900 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition border border-slate-200 dark:border-slate-800 flex flex-col group">
                <div class="relative h-48 overflow-hidden bg-slate-100 dark:bg-slate-800">
                  <img src="${art.cover_image}" alt="${art.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                  <span class="absolute top-3 left-3 px-2.5 py-1 rounded-xl text-xs font-semibold backdrop-blur-md ${getCategoryColor(art.category_color)}">
                    ${art.category_name}
                  </span>
                </div>
                <div class="p-5 flex-1 flex flex-col">
                  <div class="text-[11px] text-slate-400 mb-2">${formatTimeAgo(art.created_at)} • ${art.reading_time} mnt baca</div>
                  <h3 class="text-base font-bold text-slate-900 dark:text-white group-hover:text-indigo-600 transition line-clamp-2 leading-snug mb-2">
                    <a href="/artikel/${art.slug}">${art.title}</a>
                  </h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-4 flex-1">${art.excerpt}</p>
                  <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-400">
                    <span>👁 ${art.view_count} pembaca</span>
                    <span>❤️ ${art.likes_count} suka</span>
                  </div>
                </div>
              </article>
            `).join('');
          } else {
            grid.innerHTML = '<div class="col-span-3 text-center py-16 text-slate-400">Penulis belum memiliki artikel yang terbit.</div>';
          }
        }
      } catch (err) {
        console.error('Failed to load author profile', err);
      }
    });
  </script>
</body>
</html>
